name: Build and release Windows
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.20.0'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - run: npm ci
      - run: npm test
      - run: node scripts/build.cjs --zip
      - name: Native scanner contract
        run: |
          New-Item -ItemType Directory -Path runtime/scanner -Force
          Copy-Item dist/SpaceLens/runtime/scanner/SpaceLens.Scanner.exe runtime/scanner/
          node tests/scanner-contract.cjs
      - name: Resource monitor and real ETW attribution
        env:
          SPACELENS_TEST_RELEASE: ${{ github.workspace }}/dist/SpaceLens
          SPACELENS_TEST_ETW: '1'
        run: node tests/monitor-contract.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: SpaceLens-Windows-x64
          path: |
            dist/*.zip
            dist/*.sha256
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'
          gh release create $tag dist/*.zip dist/*.sha256 --title "SpaceLens $tag" --generate-notes

